<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest-dashboard.json">
<meta name="theme-color" content="#F0691F">
<link rel="apple-touch-icon" href="dash-icon-192.png">
<title>เข้าสู่ระบบ - PSG Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #1A1A1A; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-box { background: white; border-radius: 16px; padding: 32px 28px; width: 100%; max-width: 380px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
  .logo { text-align: center; margin-bottom: 24px; }
  .logo-mark { color: #F0691F; font-size: 32px; }
  .brand { font-size: 14px; letter-spacing: 2px; color: #F0691F; font-weight: bold; margin-top: 6px; }
  .subtitle { font-size: 12px; color: #888; margin-top: 4px; }
  h1 { font-size: 20px; color: #1A1A1A; margin-bottom: 20px; text-align: center; }
  label { display: block; font-size: 13px; font-weight: bold; color: #555; margin-bottom: 6px; }
  input { width: 100%; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 15px; margin-bottom: 14px; outline: none; }
  input:focus { border-color: #F0691F; }
  .btn { width: 100%; padding: 13px; background: #F0691F; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 8px; }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg { font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-top: 12px; text-align: center; display: none; }
  .msg.err { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; display: block; }
  .msg.ok { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; display: block; }
  .footer { text-align: center; font-size: 12px; color: #888; margin-top: 20px; }
  .footer a { color: #F0691F; text-decoration: none; }
</style>
</head>
<body>
<div class="login-box">
  <div class="logo">
    <div class="logo-mark">■</div>
    <div class="brand">PRESS SYSTEMS GROUP</div>
    <div class="subtitle">Dashboard / Admin Login</div>
  </div>
  <h1>🔐 เข้าสู่ระบบ</h1>
  <form onsubmit="doLogin(event)">
    <label>Email</label>
    <input type="email" id="email" placeholder="you@presssystems.co.th" required autocomplete="email" />
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
    <button type="submit" class="btn" id="submit-btn">เข้าสู่ระบบ</button>
    <div class="msg" id="msg"></div>
  </form>
  <div class="footer">
    <a href="index.html">← กลับหน้าคนขับ</a>
  </div>
</div>

<script>
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

  // ถ้า login อยู่แล้ว → ไป dashboard เลย
  db.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = 'dashboard.html'
  })

  async function doLogin(e) {
    e.preventDefault()
    const email = document.getElementById('email').value.trim()
    const password = document.getElementById('password').value
    const btn = document.getElementById('submit-btn')
    const msg = document.getElementById('msg')
    msg.className = 'msg'
    btn.disabled = true
    btn.textContent = 'กำลังเข้าสู่ระบบ...'

    const { data, error } = await db.auth.signInWithPassword({ email, password })

    if (error) {
      msg.className = 'msg err'
      msg.textContent = '❌ ' + (error.message === 'Invalid login credentials' ? 'Email หรือ Password ไม่ถูกต้อง' : error.message)
      btn.disabled = false
      btn.textContent = 'เข้าสู่ระบบ'
      return
    }

    msg.className = 'msg ok'
    msg.textContent = '✅ เข้าสู่ระบบสำเร็จ กำลังพาไปยังหน้า Dashboard...'
    const next = new URLSearchParams(window.location.search).get('next') || 'dashboard.html'
    setTimeout(() => window.location.href = next, 500)
  }
</script>
</body>
</html>
